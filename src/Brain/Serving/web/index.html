<body>
<div class="app" id="app">
  <nav class="strip" id="strip" aria-label="Inboxes"></nav>
  <nav class="queue" id="queue" aria-label="What waits for you"></nav>
  <main class="main" id="main" tabindex="-1"></main>
  <aside class="chat" id="chat" aria-label="Chat" hidden></aside>
  <aside class="side" id="side" aria-label="Read the graph">
    <div class="side-search">
      <input id="search" class="field search" type="search" placeholder="Search the graph" autocomplete="off" spellcheck="false" aria-label="Search the graph">
      <kbd class="hint">/</kbd>
    </div>
    <ol class="hits" id="hits"></ol>
    <div class="stack" id="stack"></div>
  </aside>
</div>
<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Commands">
    <input id="palette-input" class="field bare command" type="text" placeholder="Type a command" autocomplete="off" spellcheck="false" aria-label="Command">
    <ol class="palette-list" id="palette-list"></ol>
  </div>
</div>
<div class="palette selector" id="selector" hidden>
  <div class="palette-box selector-box" id="selector-box" role="dialog" aria-modal="true" aria-label="Model selector" tabindex="-1"></div>
</div>
<div id="image-viewer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
